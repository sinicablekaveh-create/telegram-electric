plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinicablekaveh.qrstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sinicablekaveh.qrstudio'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

// Lightweight offline QR decoding; no camera or network permission needed.
dependencies { implementation 'com.google.zxing:core:3.5.3' }