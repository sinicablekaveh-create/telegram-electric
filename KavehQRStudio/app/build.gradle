plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinicablekaveh.qrstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sinicablekaveh.qrstudio'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}