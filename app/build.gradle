plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'dev.telegram.direct'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.telegram.direct.review'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-review'
        ndk {
            abiFilters project.findProperty('smokeTest') == 'true' ? 'x86_64' : 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            buildPython 'py', '-3.13'
        } else {
            buildPython 'python3'
        }
        pip {
            options '--find-links', rootProject.file('vendor').absolutePath
            install 'telethon==1.45.0'
            install 'python-socks[asyncio]==2.8.2'
        }
    }
}
