plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'dev.telegram.direct'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.telegram.direct'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            buildPython 'py', '-3.13'
        } else {
            buildPython 'python3'
        }
        pip {
            options '--find-links', rootProject.file('vendor').absolutePath
            install 'telethon==1.45.0'
        }
    }
}
