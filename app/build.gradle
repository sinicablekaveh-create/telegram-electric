plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
def requestedVersionCode = (project.findProperty('appVersionCode') ?: '3').toString()
def requestedVersionName = (project.findProperty('appVersionName') ?: '0.3.0-review').toString()
if (!(requestedVersionCode ==~ /[1-9][0-9]*/)) {
    throw new GradleException('appVersionCode must be a positive integer')
}
def parsedVersionCode = requestedVersionCode.toLong()
if (parsedVersionCode > 2100000000L) {
    throw new GradleException('appVersionCode exceeds Android\'s supported range')
}
android {
    namespace 'dev.telegram.direct'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.telegram.direct.review'
        minSdk 26
        targetSdk 35
        versionCode parsedVersionCode.intValue()
        versionName requestedVersionName
        ndk {
            abiFilters project.findProperty('smokeTest') == 'true' ? 'x86_64' : 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            buildPython 'py', '-3.13'
        } else {
            buildPython 'python3'
        }
        pip {
            options '--find-links', rootProject.file('vendor').absolutePath
            install 'telethon==1.45.0'
            install 'python-socks[asyncio]==2.8.2'
        }
    }
}
