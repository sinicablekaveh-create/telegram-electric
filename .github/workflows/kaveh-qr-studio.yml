name: Build Kaveh QR Studio APK
on:
  push:
    paths:
      - 'KavehQRStudio/**'
      - '.github/workflows/kaveh-qr-studio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        working-directory: KavehQRStudio
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KavehQRStudio-installable-APK
          path: KavehQRStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error