name: Android install and upgrade smoke test
on:
  push:
    branches:
      - main
      - 'codex/review-variant-upgrade-smoke-*'
    paths:
      - 'app/**'
      - '.github/workflows/android-smoke.yml'
      - 'build.gradle'
      - 'settings.gradle'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-smoke.yml'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android 35 SDK
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$SDKMGR"
          printf 'y\n' | "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build baseline review APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -PsmokeTest=true \
            -PappVersionCode=3 -PappVersionName=0.3.0-review
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/telegram-review-v3.apk"
      - name: Build review upgrade APK
        run: |
          gradle --no-daemon :app:assembleDebug -PsmokeTest=true \
            -PappVersionCode=4 -PappVersionName=0.3.1-review
      - name: Boot emulator, install and upgrade review APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            app_package=dev.telegram.direct.review
            main_activity=dev.telegram.direct.MainActivity
            baseline_apk="$RUNNER_TEMP/telegram-review-v3.apk"
            upgrade_apk="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$baseline_apk"
            test -s "$upgrade_apk"

            adb install "$baseline_apk"
            baseline_version="$(adb shell dumpsys package "$app_package" | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n 1 | tr -d '\r')"
            test "$baseline_version" = "3"
            adb logcat -c
            adb shell am start -n "$app_package/$main_activity"
            for attempt in $(seq 1 30); do
              if adb shell pidof "$app_package" | tr -d '\r' | grep -Eq '[0-9]+'; then break; fi
              sleep 2
            done
            adb shell pidof "$app_package" | tr -d '\r' | grep -Eq '[0-9]+'
            adb shell run-as "$app_package" sh -c 'echo upgrade-preserved > files/install-upgrade.marker'

            adb install -r "$upgrade_apk"
            upgraded_version="$(adb shell dumpsys package "$app_package" | sed -n 's/.*versionCode=\([0-9][0-9]*\).*/\1/p' | head -n 1 | tr -d '\r')"
            test "$upgraded_version" = "4"
            marker="$(adb shell run-as "$app_package" cat files/install-upgrade.marker | tr -d '\r')"
            test "$marker" = "upgrade-preserved"

            adb shell am start -n "$app_package/$main_activity"
            for attempt in $(seq 1 30); do
              if adb shell pidof "$app_package" | tr -d '\r' | grep -Eq '[0-9]+'; then break; fi
              sleep 2
            done
            adb shell pidof "$app_package" | tr -d '\r' | grep -Eq '[0-9]+'
            resumed="$(adb shell dumpsys activity activities | tr -d '\r' | grep -F "$app_package/$main_activity" || true)"
            test -n "$resumed"
            if adb logcat -d -s AndroidRuntime:E | grep -F 'FATAL EXCEPTION'; then
              echo 'Android activity crashed during install or upgrade smoke test.'
              exit 1
            fi
      - name: Upload upgraded review APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-electric-review-upgrade-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
