name: Android launch smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android 35 SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug -PsmokeTest=true
      - name: Boot emulator, install and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.telegram.direct/.MainActivity
            sleep 10
            adb shell pidof dev.telegram.direct
            adb shell uiautomator dump /sdcard/telegram-ui.xml
            adb shell cat /sdcard/telegram-ui.xml | grep 'TELEGRAM DIRECT'
            adb logcat -d -t 600 | grep -E 'Process: dev.telegram.direct|FATAL EXCEPTION.*dev.telegram.direct' && exit 1 || true
