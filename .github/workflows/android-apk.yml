name: Build Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMGR" ]; then
            "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
          else
            test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          fi
      - name: Python syntax and offline proxy tests
        run: |
          python -m py_compile app/src/main/python/telegram_bridge.py app/src/main/python/proxy_config.py
          python -m unittest discover -s tests -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-direct-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
